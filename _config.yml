# Site settings
title: "root💀Fad-X:~#"
description: "Security Analyst (SOC) · DFIR · Detection & Response — security tooling, threat-hunting projects, and hands-on labs by Fadilulah Ajeigbe (Fad-X)."
tagline: "No Machine Is 100% efficient!!!"
author: Fadilulah Ajeigbe
lang: en

# Theme
theme: jekyll-theme-hacker

# GitHub Pages page options
show_downloads: false
show_repo: false

# Author / social (used by jekyll-seo-tag for rich link previews)
