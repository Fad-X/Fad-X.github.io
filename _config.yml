  name: Fadilulah Ajeigbe
  links:
    - https://github.com/Fad-X
    - https://linkedin.com/in/fadilulah-ajeigbe
    - https://twitter.com/_Fad_X

# Plugins (modern key — replaces the deprecated `gems:`)
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Build settings
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
